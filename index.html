<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Miriam · Calculadora de edad</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(145deg, #f9d56e 0%, #f8b56c 100%);
            font-family: 'Segoe UI', 'Poppins', 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 16px;
        }

        .app-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 30px 28px 38px;
            box-shadow: 0 25px 35px rgba(0, 0, 0, 0.25), 0 0 0 6px #ffecb3, 0 0 0 12px #ffb347;
            max-width: 680px;
            width: 100%;
            transition: all 0.2s ease;
            text-align: center;
            border: 2px dashed #ff8c42;
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            color: #d6401e;
            text-shadow: 5px 5px 0 #ffd966, 2px 2px 0 #b33e1a;
            letter-spacing: 2px;
            margin-top: -10px;
            margin-bottom: 5px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        h1 span {
            background: #ffe066;
            padding: 0 18px;
            border-radius: 80px;
            box-shadow: inset 0 -5px 0 #d4a017;
            transform: rotate(-2deg);
            display: inline-block;
            font-size: 2.2rem;
            color: #9e3c0f;
        }

        .sub {
            font-size: 1.4rem;
            font-weight: 600;
            color: #9b4b1f;
            background: #fff2c9;
            display: inline-block;
            padding: 8px 28px;
            border-radius: 50px;
            margin-bottom: 30px;
            box-shadow: 0 5px 0 #dba35b;
            border: 2px solid #ffaa33;
            transform: rotate(1deg);
        }

        .input-area {
            background: #ffdba5;
            border-radius: 120px;
            padding: 22px 18px 18px;
            box-shadow: inset 0 8px 0 #c28b3c, 0 12px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 28px;
            border: 3px solid #ffb347;
        }

        .input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 1.4rem;
            font-weight: 700;
            color: #633d0e;
            background: #ffedb0;
            padding: 10px 22px;
            border-radius: 60px;
            margin-bottom: 16px;
            border: 3px solid #c97e1e;
        }

        .input-label span {
            font-size: 2rem;
            filter: drop-shadow(0 3px 2px rgba(0, 0, 0, 0.2));
        }

        input[type="date"] {
            width: 100%;
            padding: 18px 18px;
            font-size: 1.5rem;
            font-weight: 600;
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            background: #fffcf0;
            border: 4px solid #f09b2c;
            border-radius: 50px;
            color: #32200b;
            outline: none;
            text-align: center;
            box-shadow: 0 6px 0 #b16f1a, inset 0 2px 10px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: all 0.1s ease;
            letter-spacing: 1px;
        }

        input[type="date"]:focus {
            border-color: #ff6b2b;
            background: #fff6e0;
            box-shadow: 0 6px 0 #a3530e, inset 0 2px 10px rgba(255, 140, 0, 0.2);
        }

        /* Estilo para los botones */
        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            margin-bottom: 25px;
            margin-top: 8px;
        }

        .btn {
            border: none;
            font-weight: 800;
            font-size: 1.6rem;
            padding: 18px 32px;
            border-radius: 100px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 1px;
            font-family: inherit;
            flex: 1 1 0;
            min-width: 160px;
            border: 3px solid rgba(255, 255, 255, 0.7);
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #8b5a2b;
        }

        .btn-calcular {
            background: #ff8c42;
            color: #2e1b0a;
            box-shadow: 0 10px 0 #b45115, 0 8px 15px rgba(0, 0, 0, 0.2);
            border-bottom: 3px solid #ffe484;
        }

        .btn-calcular:hover {
            background: #ff9f5b;
        }

        .btn-borrar {
            background: #f04e3e;
            color: #fff3e6;
            box-shadow: 0 10px 0 #a12b20, 0 8px 15px rgba(0, 0, 0, 0.2);
            border-bottom: 3px solid #ffb3a5;
        }

        .btn-borrar:hover {
            background: #ff6252;
        }

        /* Resultado */
        .resultado-caja {
            background: #fef7e6;
            border-radius: 40px;
            padding: 24px 16px 20px;
            margin-top: 15px;
            border: 5px solid #f7b32b;
            box-shadow: inset 0 0 0 6px #fff1c1, 0 12px 18px rgba(0, 0, 0, 0.15);
            transition: all 0.2s;
        }

        .titulo-edad {
            font-size: 1.8rem;
            font-weight: 800;
            color: #b44b1e;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .titulo-edad span {
            font-size: 2.4rem;
        }

        .edad-visual {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            background: #ffdb9f;
            padding: 20px 15px;
            border-radius: 100px;
            box-shadow: inset 0 -6px 0 #bf8f42, 0 6px 10px rgba(0, 0, 0, 0.1);
            border: 3px solid #ffb347;
            margin-bottom: 8px;
        }

        .bloque {
            background: #fff9e6;
            border-radius: 30px;
            padding: 12px 14px;
            min-width: 100px;
            box-shadow: 0 7px 0 #d49b3b, 0 6px 12px rgba(0, 0, 0, 0.1);
            border: 2px solid #ffc164;
            flex: 1 0 80px;
        }

        .bloque .numero {
            font-size: 4rem;
            font-weight: 900;
            line-height: 1.1;
            color: #bc3f0c;
            text-shadow: 3px 3px 0 #ffd58c;
            display: block;
            letter-spacing: 2px;
        }

        .bloque .etiqueta {
            font-size: 1.4rem;
            font-weight: 700;
            color: #7b4a1a;
            background: #ffeaa6;
            padding: 4px 12px;
            border-radius: 40px;
            display: inline-block;
            margin-top: 4px;
        }

        .frase-final {
            font-size: 1.3rem;
            font-weight: 600;
            color: #9c5a1d;
            background: #ffeac1;
            border-radius: 40px;
            padding: 10px 12px;
            margin-top: 18px;
            border: 3px dotted #f09b2c;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .frase-final span {
            font-size: 1.8rem;
        }

        .error-msg {
            color: #b3261e;
            background: #ffe1de;
            font-weight: 700;
            font-size: 1.2rem;
            border-radius: 40px;
            padding: 12px;
            border: 3px solid #e63946;
            margin-top: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        /* Pequeños detalles */
        .emoji-deco {
            font-size: 2rem;
            filter: drop-shadow(0 4px 3px rgba(0, 0, 0, 0.2));
        }

        @media (max-width: 500px) {
            .app-card {
                padding: 22px 16px 28px;
                border-radius: 36px;
            }

            h1 {
                font-size: 2.2rem;
            }

            h1 span {
                font-size: 1.6rem;
                padding: 0 10px;
            }

            .bloque .numero {
                font-size: 2.8rem;
            }

            .bloque .etiqueta {
                font-size: 1rem;
            }

            .btn {
                font-size: 1.2rem;
                padding: 14px 16px;
                min-width: 120px;
            }

            .titulo-edad {
                font-size: 1.4rem;
            }

            .input-label {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-card">
        <h1>
            <span>👧🧒</span> Mis Miriam <span>👦👧</span>
        </h1>
        <div class="sub">✨ Calculadora de edad ✨</div>

        <!-- Área de entrada -->
        <div class="input-area">
            <div class="input-label">
                <span>🎂</span> Fecha de nacimiento <span>🎈</span>
            </div>
            <input type="date" id="fechaNacimiento" value="2020-05-15">
        </div>

        <!-- Botones: Calcular y Borrar -->
        <div class="buttons">
            <button class="btn btn-calcular" id="btnCalcular">
                <span>🔍</span> Calcular
            </button>
            <button class="btn btn-borrar" id="btnBorrar">
                <span>🧹</span> Borrar
            </button>
        </div>

        <!-- Resultado de la edad (parte inferior) -->
        <div class="resultado-caja" id="resultadoCaja">
            <div class="titulo-edad">
                <span>⏳</span> EDAD HASTA 31/MAR/2027 <span>⏳</span>
            </div>

            <!-- Visualización de años, meses, días -->
            <div class="edad-visual" id="edadVisual">
                <div class="bloque">
                    <span class="numero" id="anios">0</span>
                    <span class="etiqueta">AÑOS</span>
                </div>
                <div class="bloque">
                    <span class="numero" id="meses">0</span>
                    <span class="etiqueta">MESES</span>
                </div>
                <div class="bloque">
                    <span class="numero" id="dias">0</span>
                    <span class="etiqueta">DÍAS</span>
                </div>
            </div>

            <!-- Mensaje adicional / fecha de referencia -->
            <div class="frase-final" id="fraseFinal">
                <span>📅</span> Edad calculada al 31 de marzo de 2027
            </div>
        </div>
    </div>

    <script>
        (function() {
            // Fecha límite: 31 de marzo de 2027 (los niños "cumplen hasta" esa fecha)
            const FECHA_LIMITE = new Date(2027, 2, 31); // mes 2 = marzo (0-index)
            
            // Elementos del DOM
            const inputFecha = document.getElementById('fechaNacimiento');
            const btnCalcular = document.getElementById('btnCalcular');
            const btnBorrar = document.getElementById('btnBorrar');
            const aniosSpan = document.getElementById('anios');
            const mesesSpan = document.getElementById('meses');
            const diasSpan = document.getElementById('dias');
            const fraseFinal = document.getElementById('fraseFinal');
            const resultadoCaja = document.getElementById('resultadoCaja');

            // ----- Función auxiliar para mostrar error y resetear valores -----
            function mostrarError(mensaje) {
                // Mostrar mensaje de error en la frase final
                fraseFinal.innerHTML = `<span>⚠️</span> ${mensaje}`;
                fraseFinal.style.background = '#ffe1de';
                fraseFinal.style.borderColor = '#e63946';
                fraseFinal.style.color = '#b3261e';
                // Resetear números
                aniosSpan.textContent = '—';
                mesesSpan.textContent = '—';
                diasSpan.textContent = '—';
            }

            // ----- Función para restablecer estilos y mostrar mensaje normal -----
            function resetEstilosFrase() {
                fraseFinal.style.background = '#ffeac1';
                fraseFinal.style.borderColor = '#f09b2c';
                fraseFinal.style.color = '#9c5a1d';
                fraseFinal.innerHTML = '<span>📅</span> Edad calculada al 31 de marzo de 2027';
            }

            // ----- Función principal: calcular edad al 31/03/2027 -----
            function calcularEdad() {
                // Obtener valor del input
                const fechaStr = inputFecha.value;
                if (!fechaStr) {
                    mostrarError('Por favor, selecciona una fecha de nacimiento.');
                    return;
                }

                // Convertir a fecha (formato YYYY-MM-DD)
                const partes = fechaStr.split('-');
                if (partes.length !== 3) {
                    mostrarError('Formato de fecha no válido.');
                    return;
                }

                const anioNac = parseInt(partes[0], 10);
                const mesNac = parseInt(partes[1], 10) - 1; // mes 0-index
                const diaNac = parseInt(partes[2], 10);

                const fechaNac = new Date(anioNac, mesNac, diaNac);

                // Verificar que la fecha sea válida (evitar desbordamiento de días, ej: 31 de febrero)
                if (fechaNac.getFullYear() !== anioNac || fechaNac.getMonth() !== mesNac || fechaNac.getDate() !== diaNac) {
                    mostrarError('La fecha ingresada no es válida.');
                    return;
                }

                // Comprobar que la fecha de nacimiento no sea posterior al límite
                if (fechaNac > FECHA_LIMITE) {
                    mostrarError('La fecha de nacimiento es posterior al 31 de marzo de 2027.');
                    return;
                }

                // --- Cálculo exacto de años, meses y días entre fechaNac y FECHA_LIMITE ---
                let anios = FECHA_LIMITE.getFullYear() - fechaNac.getFullYear();
                let meses = FECHA_LIMITE.getMonth() - fechaNac.getMonth();
                let dias = FECHA_LIMITE.getDate() - fechaNac.getDate();

                // Ajuste cuando los días son negativos
                if (dias < 0) {
                    // Tomamos prestado del mes anterior a la fecha límite
                    // Obtenemos los días del mes anterior al mes de la fecha límite
                    const mesPrestamo = FECHA_LIMITE.getMonth() - 1; // puede ser -1 (diciembre año anterior)
                    const anioPrestamo = FECHA_LIMITE.getFullYear();
                    // Creamos una fecha con el día 0 del mes actual (que es el último día del mes anterior)
                    const ultimoDiaMesAnterior = new Date(anioPrestamo, FECHA_LIMITE.getMonth(), 0).getDate();
                    
                    dias += ultimoDiaMesAnterior;
                    meses -= 1;
                }

                // Ajuste cuando los meses son negativos
                if (meses < 0) {
                    meses += 12;
                    anios -= 1;
                }

                // Validar que no haya edades negativas (por si acaso)
                if (anios < 0) {
                    mostrarError('La fecha de nacimiento es posterior a la fecha límite.');
                    return;
                }

                // Mostrar resultados
                aniosSpan.textContent = anios;
                mesesSpan.textContent = meses;
                diasSpan.textContent = dias;

                // Restaurar estilos de la frase y añadir un texto bonito
                resetEstilosFrase();
                // Personalizar mensaje con la fecha de nacimiento y la edad
                const fechaNacFormateada = `${diaNac.toString().padStart(2, '0')}/${(mesNac+1).toString().padStart(2, '0')}/${anioNac}`;
                fraseFinal.innerHTML = `<span>🎉</span> Nacido el ${fechaNacFormateada} · Edad al 31/03/2027`;
                
                // Pequeña animación en los números (efecto rebote)
                [aniosSpan, mesesSpan, diasSpan].forEach(el => {
                    el.style.transform = 'scale(1.2)';
                    setTimeout(() => { el.style.transform = 'scale(1)'; }, 150);
                });
            }

            // ----- Función borrar: limpia el input, los resultados y restaura -----
            function borrarTodo() {
                // Restablecer input a una fecha por defecto (pero vacío visualmente)
                inputFecha.value = '';  // input date vacío

                // Resetear números a 0 (o guiones)
                aniosSpan.textContent = '0';
                mesesSpan.textContent = '0';
                diasSpan.textContent = '0';

                // Restaurar frase e estilos
                resetEstilosFrase();

                // Adicional: pequeña animación de limpieza
                resultadoCaja.style.transition = '0.1s';
                resultadoCaja.style.transform = 'scale(0.99)';
                setTimeout(() => { resultadoCaja.style.transform = 'scale(1)'; }, 100);

                // Poner foco en el input para que el usuario escriba
                inputFecha.focus();
            }

            // ----- Configurar eventos -----
            btnCalcular.addEventListener('click', calcularEdad);

            btnBorrar.addEventListener('click', borrarTodo);

            // Permitir presionar Enter en el input (buena práctica)
            inputFecha.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    calcularEdad();
                }
            });

            // Inicializar: como el input tiene una fecha por defecto (2020-05-15) 
            // pero el usuario puede querer ver el cálculo de inmediato, lo hacemos al cargar.
            // Pero esperamos a que el DOM esté listo (ya lo está) y calculamos.
            window.addEventListener('load', () => {
                // Si el input tiene un valor por defecto, calcular edad automáticamente
                if (inputFecha.value) {
                    calcularEdad();
                } else {
                    // Si no, mostrar valores 0 y frase normal
                    aniosSpan.textContent = '0';
                    mesesSpan.textContent = '0';
                    diasSpan.textContent = '0';
                }
            });

            // Si el usuario cambia la fecha manualmente, no calculamos automáticamente, 
            // pero podemos sugerir que presione calcular. 
            // Opcional: podríamos calcular al cambiar, pero es mejor que el usuario presione el botón.
            // Sin embargo, para ser más intuitivo, también podemos calcular al cambiar (opcional)
            // Pero para no ser invasivo, lo dejamos solo con el botón.
            // Además, así el botón "Borrar" tiene sentido.

            // Pequeña mejora: si el usuario hace clic en el input y el valor está vacío, 
            // y luego presiona borrar, se mantiene vacío.

            // Ajuste: si el input está vacío y se presiona calcular, se muestra error.
            // Ya está manejado.

            // Nota: el rango de fechas válido para input date no tiene restricciones, 
            // pero la función calcularEdad valida que no sea posterior al 31/03/2027.
        })();
    </script>
</body>
</html>
